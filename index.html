<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:..." rel="stylesheet">
    <style>
        * {
            font-family: "Open Sans", sans-serif;
        }
    </style>
</head>

<body class="bg-[#F8FAFC]">

    <section class="max-w-7xl mx-auto px-4 md:px-12 py-10">

        <!-- heading part -->
        <div class="pb-10">
            <h1 class="text-3xl font-bold mb-6">Job Application Tracker</h1>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                <div class="bg-white p-6 rounded-2xl shadow" onmouseover="mouseOver(this)" onmouseout="mouseOut(this)">
                    <p>Total Jobs</p>
                    <p id="totalCount" class="text-2xl font-bold">0</p>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow" onmouseover="mouseOver(this)" onmouseout="mouseOut(this)">
                    <p>Interview</p>
                    <p id="interviewCount" class="text-2xl font-bold text-green-600">0</p>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow" onmouseover="mouseOver(this)" onmouseout="mouseOut(this)">
                    <p>Rejected</p>
                    <p id="rejectCount" class="text-2xl font-bold text-red-600">0</p>
                </div>

            </div>
        </div>

        <!-- AVAILABLE  JOBS -->
        <div>

            <div class="flex justify-between items-center mb-4" onmouseover="mouseOver(this)" onmouseout="mouseOut(this)">
                <h2 class="text-xl font-bold">Available Jobs</h2>
                <p id="sectionCount">0<< /p>
            </div>

           <div class="flex gap-3 mb-6">
                <button id="allBtn" onclick="showAll()" class="px-4 py-2 rounded" onmouseover="mouseOver(this)" onmouseout="mouseOut(this)">
                    All (<span id="allTab">0</span>)
                </button>

                <button id="interviewBtn" onclick="showInterview()" class="px-4 py-2 rounded" onmouseover="mouseOver(this)" onmouseout="mouseOut(this)">
                    Interview (<span id="interviewTab">0</span>)
                </button>

                <button id="rejectBtn" onclick="showRejected()" class="px-4 py-2 rounded" onmouseover="mouseOver(this)" onmouseout="mouseOut(this)">
                    Rejected (<span id="rejectTab">0</span>)
                </button>
            </div>

            <div id="jobContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>

        </div>

    </section>

    <script src="main.js"></script>
    <script src="interview.js"></script>
    <script src="reject.js"></script>

</body>
</html>
