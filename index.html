<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />

</head>

<body >

    <section >

        <!-- DASHBOARD -->
        <div >
            <h1 >Job Application Tracker</h1>

            <div >

                <div >
                    <p>Total Jobs</p>
                    <p id="totalCount" >0</p>
                </div>

                <div >
                    <p>Interview</p>
                    <p id="interviewCount" >0</p>
                </div>

                <div >
                    <p>Rejected</p>
                    <p id="rejectCount" >0</p>
                </div>

            </div>
        </div>

        <!-- AVAILABLE JOBS -->
        <div>

            <div >
                <h2 >Available Jobs</h2>
                <p>Total: <span id="sectionCount">0</span></p>
            </div>

            <div >
                <button onclick="showAll()" >
                    All (<span id="allTab">0</span>)
                </button>

                <button onclick="showInterview()" >
                    Interview (<span id="interviewTab">0</span>)
                </button>

                <button onclick="showRejected()" >
                    Rejected (<span id="rejectTab">0</span>)
                </button>
            </div>

            <div id="jobContainer" ></div>

        </div>

    </section>

    <script src="main.js"></script>
    <script src="interview.js"></script>
    <script src="reject.js"></script>

</body>

</html>
